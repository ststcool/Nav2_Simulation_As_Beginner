# RTAB-Map 参数配置 (适用于 TurtleBot3 waffle + Gazebo Classic)
# 加载方式: 在 visual_slam_launch.py 中传入 rtabmap_node 的 parameters 字段
# 参考: https://github.com/introlab/rtabmap/wiki/Parameters

# --- 视觉特征 ---
Vis/CorNNType           = 0            # 0=ORB, 1=SIFT, 2=SURF, 4=BRIEF, 6=FAST/BRIEF
                                        # 建议 ORB (速度快，Gazebo 纹理充足)
Vis/FeatureType         = 6            # 6=ORB (与 CorNNType 保持一致)
Vis/MaxFeatures         = 400          # 每帧最大特征点数 (默认 1000，适当降低提升速度)
Vis/MinInliers          = 15           # 视觉里程计最少内点

# --- 内存与闭环 ---
Mem/STMSize             = 30           # 短期记忆 (关键帧数)，小环境可降低
Mem/UseOdomFeatures     = true         # 使用里程计特征关联连续帧
RGBD/LinearUpdate       = 0.1          # 线性运动超过此值插入新关键帧 (米)
RGBD/AngularUpdate      = 0.1          # 角运动超过此值插入新关键帧 (弧度)

# --- 闭环检测 ---
RGBD/OptimizeFromGraphEnd = false      # 闭环时从图末端优化 (false=从首个闭环优化)
Kp/MaxFeatures          = -1           # -1=从词袋取值
LccBowMinInliers        = 15           # 闭环检测最少内点 (高于此值才接受闭环)

# --- 地图发布 ---
Grid/FromDepth          = true         # 从深度点云投影 2D 栅格地图
Grid/RangeMin           = 0.3          # 最小深度范围 (米)
Grid/RangeMax           = 5.0          # 最大深度范围 (米)
Grid/GroundIsObstacle   = false        # 地面不作为障碍物
Grid/3D                 = false        # false=2D 栅格, true=3D OctoMap

# --- 输出 (ROS 话题) ---
Grid/MapFrame            = map
Grid/OutputFrame         = map
